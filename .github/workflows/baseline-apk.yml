name: Zangetsu baseline APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/baseline-apk.yml

permissions:
  contents: read

concurrency:
  group: baseline-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'aliakbar6821/Zangetsu'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Supported upstream options: no proprietary Discord SDK in the public fork.
      ZANGETSU_NO_DISCORD: '1'
      # Separate .nightly package; does not replace the existing streamHub app.
      ZANGETSU_NIGHTLY: '1'
    steps:
      - name: Check out selected source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pinned upstream Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Record baseline toolchain and source
        run: |
          mkdir -p baseline-artifacts
          {
            echo 'Zangetsu baseline test - original name/UI; no streamHub migration yet'
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'Variant: DEBUG, upstream .nightly identity, Discord disabled'
            echo 'Signing: temporary runner debug key, NOT the streamHub private release key'
            echo 'A subsequent CI build may have a different debug signature.'
            echo 'No signing keys or credentials are included in this artifact.'
            flutter --version
            java -version 2>&1
          } > baseline-artifacts/BUILD-INFO.txt
          cat baseline-artifacts/BUILD-INFO.txt
          test ! -f android/key.properties || {
            echo 'Unexpected signing configuration in baseline checkout. Refusing to use it.'
            exit 1
          }

      - name: Install native build tool
        run: sdkmanager 'cmake;3.22.1'

      - name: Resolve upstream dependencies
        run: flutter pub get 2>&1 | tee baseline-artifacts/dependencies.log

      - name: Build baseline debug APK (ARM32 and ARM64)
        run: |
          flutter build apk --debug --target-platform android-arm,android-arm64 2>&1 | tee baseline-artifacts/build.log
          cp build/app/outputs/flutter-apk/app-debug.apk baseline-artifacts/Zangetsu-baseline.apk
          cd baseline-artifacts
          sha256sum Zangetsu-baseline.apk > SHA256SUMS.txt
          {
            echo '## Baseline APK built'
            echo 'Download the Zangetsu-baseline artifact below, extract it and install Zangetsu-baseline.apk.'
            echo 'This is a temporary debug-signed test build, not a production streamHub release.'
            echo 'Expected launcher name: Zangetsu Nightly. Expected package: com.spyou.watch_app.nightly.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and build information
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zangetsu-baseline-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            baseline-artifacts/Zangetsu-baseline.apk
            baseline-artifacts/BUILD-INFO.txt
            baseline-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zangetsu-baseline-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            baseline-artifacts/*.log
            baseline-artifacts/BUILD-INFO.txt
          if-no-files-found: ignore
          retention-days: 7
